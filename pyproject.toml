[project]
name = "snake-rl"
version = "0.1.0"
description = "A neural network that teaches itself to play Snake with Deep Q-Learning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pygame>=2.6.1",
    "torch>=2.2",
]

[project.scripts]
snake-train = "snake_rl.agent:train"
snake-play = "snake_rl.play:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The network is tiny, so the CPU build of torch is plenty (and far smaller than the CUDA one).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
